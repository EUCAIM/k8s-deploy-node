apiVersion: apps/v1
kind: Deployment
metadata:
  name: orthanc
  namespace: dataset-service
  labels:
    app: orthanc
spec:
  replicas: 1 # Standard Orthanc (SQLite) does not support multiple replicas
  selector:
    matchLabels:
      app: orthanc
  template:
    metadata:
      labels:
        app: orthanc
    spec:
      containers:
      - name: orthanc
        image: harbor.eucaim.cancerimage.eu/library/orthanc/orthanc@sha256:6977e8a7e37c7d866d94f51b6a3fcdcdb1b0c6d46bd792c8c823dea5de0c9201
        ports:
        - containerPort: 8042
          name: http-web
        - containerPort: 4242
          name: dicom
        env:
        - name: ORTHANC_JSON
          valueFrom:
            configMapKeyRef:
              name: orthanc-config
              key: ORTHANC_JSON
        - name: ORTHANC__DICOM_AET
          value: ORTHANC_K8S
        - name: DICOM_WEB_PLUGIN_ENABLED
          value: 'true'
        - name: OHIF_PLUGIN_ENABLED
          value: 'true'
        volumeMounts:
        - name: datalake-storage
          mountPath: /var/lib/orthanc/db
          subPath: orthanc/db
        - name: datalake-storage
          mountPath: /var/lib/orthanc/dicom
          subPath: orthanc/dicom
      volumes:
      - name: datalake-storage
        persistentVolumeClaim:
          claimName: datalake-data
---
apiVersion: v1
kind: Service
metadata:
  name: orthanc-service
  namespace: dataset-service
spec:
  type: ClusterIP
  selector:
    app: orthanc
  ports:
  - name: web-ui
    protocol: TCP
    port: 80
    targetPort: 8042
  - name: dicom-port
    protocol: TCP
    port: 4242
    targetPort: 4242
---
