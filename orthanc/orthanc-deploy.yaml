---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orthanc
  namespace: orthanc
  labels:
    app: orthanc
spec:
  replicas: 1 # Standard Orthanc (SQLite) does not support multiple replicas
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orthanc
  template:
    metadata:
      labels:
        app: orthanc
    spec:
      containers:
      - name: orthanc
        image: harbor.eucaim.cancerimage.eu/library/orthanc/orthanc:26.1.0
        ports:
        - containerPort: 8042
          name: http-web
        - containerPort: 4242
          name: dicom
        env:
        - name: ORTHANC_JSON
          valueFrom:
            configMapKeyRef:
              name: orthanc-config
              key: ORTHANC_JSON
        - name: ORTHANC__DICOM_AET
          value: ORTHANC_K8S
        - name: DICOM_WEB_PLUGIN_ENABLED
          value: 'true'
        - name: OHIF_PLUGIN_ENABLED
          value: 'true'
        - name: PATIENT_ID_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: patient-id-encryption-key
              key: patient-id-encryption-key
        volumeMounts:
        - name: storage
          mountPath: /var/lib/orthanc
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: orthanc-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: orthanc-service
  namespace: orthanc
spec:
  type: ClusterIP
  selector:
    app: orthanc
  ports:
  - name: web-ui
    protocol: TCP
    port: 80
    targetPort: 8042
  - name: dicom-port
    protocol: TCP
    port: 4242
    targetPort: 4242
---
