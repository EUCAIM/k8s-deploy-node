apiVersion: v1
kind: Service
metadata:
  name: service-ok
spec:
  selector:
    app: MyApp
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: service-externalIP
spec:
  selector:
    app: MyApp
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  externalIPs:
    - 80.11.12.10
---
apiVersion: v1
kind: Service
metadata:
  name: service-nodeport
spec:
  ports:
  - name: http
    nodePort: 31080
    port: 80
    protocol: TCP
    targetPort: 8080
  type: NodePort