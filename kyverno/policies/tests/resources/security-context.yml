apiVersion: v1
kind: Pod
metadata:
  name: pod-securitycontext-ok
  labels:
    app: ubuntu
spec: 
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  initContainers:
  - name: install
    image: chaimeleon-eu.i3m.upv.es:10443/chaimeleon-library/base-vol:latest
    securityContext:
      runAsGroup: 1000
  containers:
  - name: ubuntu
    image: chaimeleon-eu.i3m.upv.es:10443/chaimeleon-library/base-vol:latest
    securityContext:
      runAsGroup: 1000
---
