apiVersion: v1
kind: Pod
metadata:
  name: pod-glusterfs
  labels:
    app: ubuntu
spec: 
  containers:
  - name: ubuntu
    image: chaimeleon-eu.i3m.upv.es:10443/chaimeleon-library/base-vol:latest
  volumes:
  - name: glusterfsvol
    glusterfs:
      endpoints: glusterfs-cluster
      path: kube_vol
      readOnly: true