apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: "deny-modify-chaimeleon-configmap"
  annotations:
    policies.kyverno.io/category: Chaimeleon
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.3.6
    policies.kyverno.io/subject: Configmap
    policies.kyverno.io/description: >-
      Ensure users do not modify the chaimeleon ConfigMap
spec:
  validationFailureAction: enforce
  background: false
  rules:
    - name: deny-modify-chaimeleon-configmap
      match:
        resources:
          kinds:
            - "ConfigMap"
        subjects:
        - kind: Group
          name: "oidc:data-scientists"
        - kind: Group
          name: "oidc:external-researcher"
        - kind: Group
          name: "oidc:application-developer"
        - kind: Group
          name: "oidc:cloud-services-and-security-management"
      preconditions:
        any:
        - key: "{{ request.operation }}"
          operator: Equals
          value: CREATE
        - key: "{{ request.operation }}"
          operator: Equals
          value: UPDATE
      validate:
        deny:
          conditions:
            - key: "{{ request.name }}"
              operator: Equals
              value: chaimeleon
        message: >
          The chaimeleon ConfigMap cannot be modified by regular users.

