apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: validate-security-context-users
  annotations:
    policies.kyverno.io/title: Validate User ID, Group ID, and FS Group
    policies.kyverno.io/category: Sample
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All processes inside a Pod can be made to run with specific userID and groupID
      by setting `runAsUser` and `runAsGroup` respectively. `fsGroup` can be specified
      to make sure any file created in the volume will have the specified groupID.
      This policy validates that these fields are set to the defined values.
spec:
  validationFailureAction: enforce
  background: false
  rules:
  - name: validate-userid
    match:
      resources:
        kinds:
        - Pod
      subjects:
      - kind: Group
        name: "oidc:data-scientists"
      - kind: Group
        name: "oidc:external-researcher"
      - kind: Group
        name: "oidc:application-developer"
      - kind: Group
        name: "oidc:cloud-services-and-security-management"
    validate:
      message: "User ID should be 1000."
      pattern:
        spec:
          securityContext:
            runAsUser: '1000'
  - name: validate-groupid
    match:
      resources:
        kinds:
        - Pod
      subjects:
      - kind: Group
        name: "oidc:data-scientists"
      - kind: Group
        name: "oidc:external-researcher"
      - kind: Group
        name: "oidc:application-developer"
      - kind: Group
        name: "oidc:cloud-services-and-security-management"
    validate:
      message: "Group ID should be 1000."
      pattern:
        spec:
          # securityContext:
          #   runAsGroup: '1000'
          securityContext:
            runAsGroup: "1000"
          =(initContainers):
            - =(securityContext):
                =(runAsGroup): "1000"
          containers:
            - =(securityContext):
                =(runAsGroup): "1000"
  - name: validate-fsgroup
    match:
      resources:
        kinds:
        - Pod
      subjects:
      - kind: Group
        name: "oidc:data-scientists"
      - kind: Group
        name: "oidc:external-researcher"
      - kind: Group
        name: "oidc:application-developer"
      - kind: Group
        name: "oidc:cloud-services-and-security-management"   
    validate:
      message: "fsgroup should be 1000."
      pattern:
        spec:
          securityContext:
            fsGroup: "1000"
