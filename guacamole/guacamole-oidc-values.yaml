
# Default values for guacamole.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

guacamole:
  image:
    repository: guacamole/guacamole
    tag: "{{ .Chart.AppVersion }}"
    pullPolicy: IfNotPresent

guacd:
  image:
    repository: guacamole/guacd
    tag: "{{ .Chart.AppVersion }}"
    pullPolicy: IfNotPresent

dbcreation:
  image:
    repository: bitnami/postgresql
    tag: 11.7.0-debian-10-r9
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: guac2

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  annotations: #{}
     kubernetes.io/ingress.class: nginx
     kubernetes.io/tls-acme: "true"
     nginx.ingress.kubernetes.io/proxy-body-size: 100000m
     #     nginx.ingress.kubernetes.io/rewrite-target: /guacamole/$1
  hosts:
    - host: chaimeleon-eu.i3m.upv.es
      paths: #[]
        - '/guacamole/?(.*)'

  tls: #[]
    - secretName: chaimeleon-eu.i3m.upv.es
      hosts:
        - chaimeleon-eu.i3m.upv.es

priorityClassName: "core-applications"

resources: 
  requests:
    memory: 2Gi
    cpu: 1
  limits:
    memory: 2Gi
    cpu: 1

nodeSelector: {}

tolerations: []

affinity: {}

postgres:
  hostname: "10.98.114.250" # "postgresql.guacamole.svc.cluster.local" # "10.253.2.15" 
  port: "5432"
  database: "guacamole"
  user: "grycap-admin"
  password: "XXXXXXXXXXXXXXXX"

OIDC:
  authorization_endpoint: "https://chaimeleon-eu.i3m.upv.es/auth/realms/CHAIMELEON/protocol/openid-connect/auth/"
  jwks_endpoint: "https://chaimeleon-eu.i3m.upv.es/auth/realms/CHAIMELEON/protocol/openid-connect/certs/"
  issuer: "https://chaimeleon-eu.i3m.upv.es/auth/realms/CHAIMELEON"
  clientID: "guacamole"
  redirect_uri: "https://chaimeleon-eu.i3m.upv.es/guacamole/"
  username_claim_type: "username"
  groups_claim_type: "groups"

#redirect_uri: "https://chaimeleon-eu.i3m.upv.es/oidc-guacamole/"
