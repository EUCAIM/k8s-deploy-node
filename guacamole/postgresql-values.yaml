# ref: https://artifacthub.io/packages/helm/bitnami/postgresql/15.5.29#parameters
# https://github.com/bitnami/bitnami-docker-postgresql/blob/master/README.md

image:
# registry: docker.io
  registry: harbor.eucaim-node.i3m.upv.es/dockerhub/bitnamilegacy/postgresql
  # Fixed image version because the new major versions of PostgreSQL typically introduce some user-visible incompatibilities, so application programming changes might be required. 
  # ref: https://www.postgresql.org/docs/current/upgrading.html
  # Last version is 17. Pending to know if Guacamole is compatible with it and then do the upgrade with pg_dumpall or pg_upgrade.
  tag: 17.2.0-debian-12-r5

auth:
  postgresPassword: XXXXXXXXXXXX
  username: XXXXXXXXXX
  password: XXXXXXXXXXXX
  database: guacamole

#postgresqlDataDir: /bitnami/postgresql/data

primary:
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 500Mi
      cpu: 500m
  nodeSelector:
    chaimeleon.eu/target: core-services
  priorityClassName: core-applications
  persistence:
    enabled: true
    existingClaim: guacamole-postgresql
#   mountPath: /bitnami/postgresql
#   storageClass: "cephfs"
#   size: 1Gi

## This enables an init container that changes the owner and group of the persistent volume 
volumePermissions:
  enabled: true
  image:
#   registry: docker.io
    registry: harbor.eucaim-node.i3m.upv.es/dockerhub

