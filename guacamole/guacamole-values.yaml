
# Default values for guacamole.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

guacamole:
  image:
    repository: guacamole/guacamole
    tag: "{{ .Chart.AppVersion }}"
    pullPolicy: IfNotPresent

guacd:
  image:
    repository: guacamole/guacd
    tag: "{{ .Chart.AppVersion }}"
    pullPolicy: IfNotPresent

dbcreation:
  image:
    repository: bitnami/postgresql
    tag: 11.7.0-debian-10-r9
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: guacamole

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  annotations: #{}
     kubernetes.io/ingress.class: nginx
     kubernetes.io/tls-acme: "true"
     nginx.ingress.kubernetes.io/proxy-body-size: 100000m
  hosts:
    - host: chaimeleon-eu.i3m.upv.es
      paths: #[]
        - '/guacamole'

  tls: #[]
    - secretName: letsencryp-cert-tls
      hosts:
        - chaimeleon-eu.i3m.upv.es

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

postgres:
  hostname: "10.108.142.178" # "postgresql.guacamole.svc.cluster.local" # "10.253.2.15" 
  port: "5432"
  database: "guacamole"
  user: "grycap-admin"
