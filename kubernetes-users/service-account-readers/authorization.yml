---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaimeleon-sac-pod-view-namespace
rules:
- apiGroups: ["*"]
  resources: ["pods","pods/log","pods/exec", "jobs", "deployments", "replicasets", "daemonsets", "replicationcontrollers", "statefulsets","configmaps", "container", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["*"]
  resources: ["events", "ingresses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaimeleon-sac-role-cluster
rules:
- apiGroups: ["*"]
  resources: ["namespaces"]
  verbs: ["get", "list","watch"]
