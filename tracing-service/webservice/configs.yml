apiVersion: v1
kind: ConfigMap
metadata:
  name: tracing-service-config
  namespace: tracing-service
data:
  settings.yml: |
    database:
      user: tracing
      host: tracing-db
      port: 5432
      name: tracing
      pool:
        min_size: 3
        max_size: 3
    oidc:
      url: http://keycloak.keycloak:8080
      realm: EUCAIM-NODE
      client: tracing-service
      audiences: [
        "tracing-service"
      ]
    api:
      prefix: ""
      v2:
        default_traces_limit: 20
