
apiVersion: batch/v1
kind: Job
metadata:
  name: tracing-service-init
  namespace: tracing-service
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:        
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 2000
        runAsNonRoot: true
      containers:
        - name: psql
          env:
            - name: TRACING_DB_ADMIN_NAME
              value: immudb
          image: harbor.eucaim-node.i3m.upv.es/core-services/tracing-service-init:1.0.3-alpha
          volumeMounts:
            - name: tracing-service-config
              mountPath: /opt/tracing/settings.yml
              subPath: settings.yml
            - name: tracing-service-secrets
              mountPath: /opt/tracing/settings_secret.yml
              subPath: settings_secret.yml
            - name: tracing-db-secrets
              mountPath: /opt/tracing/TRACING_DB_ADMIN_PASSWORD
              subPath: immudb-admin-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tracing-service-config
          configMap:
            defaultMode: 400
            name: tracing-service-config
            optional: false
        - name: tracing-service-secrets
          secret:
            defaultMode: 400
            secretName: tracing-service-secrets
            optional: false
        - name: tracing-db-secrets
          secret:
            defaultMode: 400
            # This must match the name of the secret generated by helm with the admin password of the database
            secretName: tracing-db-credentials
            optional: false
