apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tracing-service
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tracing-db
  namespace: tracing-service
spec:
  podSelector: 
    matchLabels:
      app.kubernetes.io/name: tracing-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tracing-service
          podSelector:
            matchLabels:
              app: tracing-webservice
      ports:
        - protocol: TCP
          port: 5432

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tracing-webservice
  namespace: tracing-service
spec:
  podSelector: 
    matchLabels:
      app: tracing-webservice
  policyTypes:
    - Egress
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dataset-service
          podSelector:
            matchLabels:
              app: dataset-service-backend
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tracing-service
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tracing-db
      ports:
        - protocol: TCP
          port: 5432
    - to:   # For connecting to any of the services exposed in the public domain through ingress-nginx.
            # Depending on the CoreDNS configuration, internal connections to this public domain may be resolved
            # to the public IP address or to the local IP address. In case of doubt put both.
            # It is particularly required for accessing datasets-service web 
            # for creating new versions of dataset (e.g. after the ETL process).
        - ipBlock:
            cidr: 192.168.1.162/32
        - ipBlock:
            cidr: 158.42.106.140/32
      ports:
        - port: 443
        # - port: 80
        # Note port 6443 is not included to avoid connections to kube-apiserver

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53