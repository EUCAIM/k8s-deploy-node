apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-deployer-pvc
  namespace: tracing-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-deployer-sa
  namespace: tracing-service

---


apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-deployer-role
  namespace: tracing-service
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-deployer-rb
  namespace: tracing-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-deployer-role
subjects:
- kind: ServiceAccount
  name: k8s-deployer-sa
  namespace: tracing-service
  
---

apiVersion: batch/v1
kind: Job
metadata:
  name: k8s-deployer
  namespace: tracing-service
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      priorityClassName: core-services
      nodeSelector:
        chaimeleon.eu/target: core-services
      serviceAccountName: k8s-deployer-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 2000
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: k8s-deployer-pvc
      containers:
      - name: k8s-deployer
        image: alpine/k8s:1.37.1
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: storage
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "256Mi"
            cpu: "1"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        command: ["/bin/sh"]
        args:
          - -c
          - sleep 36000
      restartPolicy: Never

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-deployer
  namespace: tracing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-deployer
  template:
    metadata:
      labels:
        app: k8s-deployer
    spec:
      priorityClassName: core-services
      nodeSelector:
        chaimeleon.eu/target: core-services
      serviceAccountName: k8s-deployer-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 2000
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: k8s-deployer-pvc
      containers:
      - name: k8s-deployer
        image: alpine/k8s:1.37.1
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: storage
          mountPath: /data
        resources:
        requests:
            memory: "256Mi"
            cpu: "200m"
        limits:
            memory: "256Mi"
            cpu: "1"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        command: ["/bin/sh"]
        args:
          - -c
          - sleep infinity
