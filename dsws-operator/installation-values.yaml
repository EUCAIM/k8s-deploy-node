
priorityClassName: "core-services"
nodeSelector: 
  chaimeleon.eu/target: core-services

serviceAccount:
  annotations: {}
  name: ""

rbac:
  role:
    name: "dsws-operator-namespaced"
  clusterRole:
    name: "dsws-operator-cluster"
  roleBinding:
    name: "dsws-operator-rolebinding-namespaced"
  clusterRoleBinding:
    name: "dsws-operator-rolebinding-cluster"

operatorConfiguration:
  auth:
    url: "https://eucaim-node.i3m.upv.es/auth/realms/EUCAIM-NODE/protocol/openid-connect/token"
    client_id: "kubernetes-operator"
    client_secret: "XXXXXXXXXXXXXXXX"
    max_retries: 10

  dataset_service:
    url: "http://dataset-service-backend-service.dataset-service.svc.cluster.local:11000/"
    test_url: ""
    max_retries: 10

  guacamole:
    url: "https://eucaim-node.i3m.upv.es/guacamole/"
    user: "service-account-kubernetes-operator"
    password: "XXXXXXXXXXXXXXXX"
    connections_creation:
      backend_host: "guacamole-guacd.guacamole.svc.cluster.local"
      vnc_port: "5900"
      sftp_default_username: "ds"
      sftp_port: "2222"

  k8s:
    user_prefix: "oidc:"
    admins_group: "oidc:cloud-services-and-security-management"
    namespace_prefix: "user-"
    jobman_service_execution_namespace: "jobman-service-exec"
    node_selection: true

    volumes:
      type: "hostPath"
      cephfs:
        monitors: ['192.168.12.210:6789', '192.168.12.211:6789']
        user_prefix: "eucaim-user--"
        auth_secret_name: "ceph-auth"
        jobman_service_execution_user: "jobman-service-exec"
      
      datalake_path: ""
      datasets_path: "/mnt/datasets"
      test_datalake_path: ""
      test_datasets_path: "/mnt/datasets-test"
      persistent_homes_path: "/mnt/cephfs/data/homes/users"
      persistent_shared_folder_path: "/mnt/cephfs/data/homes/shared-folder"
      persistent_shared_folder_read_only: true

    checks:
      allowed_repo: "harbor.eucaim-node.i3m.upv.es"
      not_allowed_repo_message: "The image must be one of our internal repository 'harbor.eucaim-node.i3m.upv.es'."

      allowed_images_for_deployment: []

      allowed_users_to_deploy: []

      max_num_deployments_per_user: 5
      max_num_pods_per_user: 0
    
      protected_project: "library-batch-protected"

    resource_flavors:
      jobs:
        flavors:
          - name: "small-gpu"
            resources: { target_node: "small-gpu", cpu: "3", max_cpu: "6", memory_gb: 28,  gpu: true }
          - name: "medium-gpu"
            resources: { target_node: "medium-gpu", cpu: "7", max_cpu: "8", memory_gb: 60,  gpu: true }
          - name: "large-gpu"
            resources: { target_node: "large-gpu", cpu: "7", max_cpu: "8", memory_gb: 60,  gpu: true }
          - name: "no-gpu"
            resources: { target_node: "no-gpu", cpu: "7", max_cpu: "8", memory_gb: 60,  gpu: false }
        default_flavor_name: "medium-gpu"
      deployments:
        flavors:
          - name: "desktop"
            tool_match: "desktop-tensorflow|desktop-pytorch|jupyter-tensorflow|jupyter-pytorch"
            resources: { target_node: "desktops",  cpu: "900m",  max_cpu: "2",  memory_gb: 7,  gpu: false }
          - name: "app-service-cpu300"
            tool_match: "nifi"
            name_match: "nifi-nifi|nifi-desktop"
            # nifi has 5 deployments, the nifi-nifi and nifi-desktop need more cpu
            resources: { target_node: "desktops",  cpu: "300m",  max_cpu: "1",  memory_gb: 2,  gpu: false }
          - name: "app-service-cpu200"
            tool_match: "analytic-engine"
            name_match: "ai-layer-ws|ai-layer-trino"
            # analytical-engine has 7 deployments, the ws and trino needs more cpu
            resources: { target_node: "desktops",  cpu: "200m",  max_cpu: "1",  memory_gb: 1,  gpu: false }
          - name: "app-service-cpu100"
            tool_match: "analytic-engine|nifi"
            # the rest of deployments of these apps
            resources: { target_node: "desktops",  cpu: "100m",  max_cpu: "500m",  memory_gb: 1,  gpu: false }
          - name: "app-service-cpu400"
            tool_match: "chaimeleon-superset"
            # superset has 1 deployment with 2 containers
            resources: { target_node: "desktops",  cpu: "400m",  max_cpu: "1",  memory_gb: 3,  gpu: false }
          - name: "other"
            # This entry at the end match anything and assigns the minimum resources to any unknown deployment.
            tool_match: ".*"
            resources: { target_node: "desktops",  cpu: "100m",  max_cpu: "200m",  memory_gb: 1,  gpu: false }
    
service:
  type: ClusterIP
  port: 443

image:
  repository: "harbor.chaimeleon-eu.i3m.upv.es/chaimeleon-services/k8s-operator"
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion, uncomment and set only if you want to launch a specific version.
  #tag: "X.X.X-kopfX.X.X"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

resources:
  requests:
    cpu: "1000m"
    memory: "1000Mi"
  limits:
    cpu: "1000m"
    memory: "1000Mi"
