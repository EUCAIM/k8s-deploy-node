# The permissions for every user in the zz-shared namespace.
# This is used by jobman to get the list of jobs in queue (which is in a configmap in that namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oidc:data-scientists-in-zz-shared-namespace
rules:
  - apiGroups: ["*"]
    resources: ["configmaps"]
    verbs: ["get","list","watch"]
