# Doc: https://github.com/kubeapps/kubeapps/tree/master/chart/kubeapps#parameters

ingress:
  enabled: true
  hostname: "chaimeleon-eu.i3m.upv.es"
  path: "/apps/?(.*)"
# tls: true
# extraHosts:
# - name: "chaimeleon-eu.i3m.upv.es"
#   path: "/apps/?(.*)"
  extraTls:
  - hosts:
    - "chaimeleon-eu.i3m.upv.es"
#   secretName: "chaimeleon-eu.i3m.upv.es"
# secrets:
# - name: "chaimeleon-eu.i3m.upv.es"
  annotations:
    kubernetes.io/ingress.class: nginx
    # The following line is needed when the proxy returns "502 - bad gateway" 
    # and in the proxy log apears: ERROR upstream sent too big header while reading response header from upstream
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k

postgresql:
  enabled: true
  image:
    registry: "harbor.chaimeleon-eu.i3m.upv.es/dockerhub"
  auth:
    password: XXXXXXXXXXXXX
  architecture: standalone
  primary:
    persistence:
      enabled: true
      size: 1Gi
      storageClass: cephfs
    priorityClassName: "core-applications"
  resources:
    requests:
      memory: 500Mi
      cpu: 500m
    limits:
      memory: 500Mi
      cpu: 500m

## https://github.com/kubeapps/kubeapps/blob/master/docs/user/using-an-OIDC-provider.md
authProxy:
  enabled: true
  external: false
  image:
    registry: "harbor.chaimeleon-eu.i3m.upv.es/dockerhub"
  resources:
    requests:
      memory: 128Mi
      cpu: 250m
    limits:
      memory: 128Mi
      cpu: 250m
  oauthLoginURI: "/apps/oauth2/start?rd=%2Fapps%2F"
  oauthLogoutURI: "/apps/oauth2/sign_out?rd=%2Fapps%2F"
# oauthLoginURI: "/apps/oauth2/login"
# oauthLogoutURI: "/apps/oauth2/logout"
  skipKubeappsLoginPage: true
  provider: oidc
  clientID: "kubernetes"
  clientSecret: XXXXXXXXXXXXX
  ## python -c 'import os,base64; print base64.urlsafe_b64encode(os.urandom(16))'
  cookieSecret: XXXXXXXXXXXXX
  extraFlags:
    - "--oidc-issuer-url=https://chaimeleon-eu.i3m.upv.es/auth/realms/CHAIMELEON"
    - "--proxy-prefix=/apps/oauth2"
    - "--scope=openid email"
    - "--set-authorization-header=true"
    - "--cookie-name=oauth2kubeapps"
    - "--cookie-path=/apps/"
    - "--skip-provider-button=true"


frontend:
  image:
    registry: "harbor.chaimeleon-eu.i3m.upv.es/dockerhub"
  replicaCount: 1
  priorityClassName: "core-applications"
  resources:
    requests:
      memory: 128Mi
      cpu: 250m
    limits:
      memory: 128Mi
      cpu: 250m

