postgresql:
  enabled: true
  image:
    registry: harbor.eucaim-node.i3m.upv.es/core-services
    repository: bitnami/postgresql
  auth:
    username: postgres
    password: lHmXy1aTD66zkCWh
  architecture: standalone
  primary:
    persistence:
      enabled: true
      size: 1Gi
      storageClass: standard
    priorityClassName: core-applications
  resources:
    requests:
      memory: 200Mi
      cpu: 200m
    limits:
      memory: 200Mi
      cpu: 200m
ingress:
  enabled: false
  hostname: mininode.imaging.i3m.upv.es
  path: /apps/?(.*)
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
authProxy:
  enabled: true
  external: false
  image:
    registry: harbor.eucaim-node.i3m.upv.es/core-services
    repository: bitnami/oauth2-proxy
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 128Mi
      cpu: 100m
  oauthLoginURI: /apps/oauth2/start?rd=%2Fapps%2F
  oauthLogoutURI: /apps/oauth2/sign_out?rd=https%3A%2F%2Fmininode%2Eimaging%2Ei3m%2Eupv%2Ees%2Fauth%2Frealms%2FEUCAIM-NODE%2Fprotocol%2Fopenid-connect%2Flogout%3Fclient_id%3Dkubernetes%26post_logout_redirect_uri%3Dhttps%3A%2F%2Fmininode%2Eimaging%2Ei3m%2Eupv%2Ees%2Fapps%2F
  skipKubeappsLoginPage: false
  provider: oidc
  clientID: kubernetes
  clientSecret: llOqmNpqaXcsVvifWCfV4sNQGI699utI
  cookieSecret: qfvutCl11omGgsc42aMpUQ==
  extraFlags:
  - --oidc-issuer-url=https://mininode.imaging.i3m.upv.es/auth/realms/EUCAIM-NODE
  - --proxy-prefix=/apps/oauth2
  - --scope=openid email
  - --set-authorization-header=true
  - --cookie-name=_oauth2_kubeapps_v2
  - --cookie-path=/apps/
  - --whitelist-domain=mininode.imaging.i3m.upv.es
  - --skip-auth-regex=^\/apps\/config\.json$
  - --skip-auth-regex=^\/apps\/site\.webmanifest$
  - --skip-auth-regex=^\/apps\/custom_style\.css$
  - --skip-auth-regex=^\/apps\/clr-ui.min\.css$
  - --skip-auth-regex=^\/apps\/clr-ui-dark.min\.css$
  - --skip-auth-regex=^\/apps\/custom_locale\.json$
  - --skip-auth-regex=^\/apps\/favicon.*\.png$
  - --skip-auth-regex=^\/apps\/favicon.*\.ico$
  - --skip-auth-regex=^\/apps\/android-chrome-.*\.png$
  - --skip-auth-regex=^\/apps\/static\/
  - --skip-auth-regex=^\/apps\/apis/core/plugins/v1alpha1/configured-plugins$
  - --skip-auth-regex=^\/apps\/apis/kubeappsapis.core.plugins.v1alpha1.PluginsService/GetConfiguredPlugins$
