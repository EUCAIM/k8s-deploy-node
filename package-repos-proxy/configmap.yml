apiVersion: v1
kind: ConfigMap
metadata:
  name: package-repos-proxy-config
  namespace: package-repos-proxy
data:
  nginx.conf: |
    user  nginx;
    worker_processes  1;
    error_log  /data/nginx-error.log info;
    pid        /var/run/nginx.pid;
    events {
        worker_connections  1024;
    }
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          '$http_host '
                          '$host';
      access_log  /data/nginx-access.log  main;
      sendfile        on;
      keepalive_timeout  65;
      server {
        listen 80;

        ##  Deny all locations unless specified otherwise
        location / { deny all; }

        location /healthz {
          return 200;
        }

        ## Below three pages should be served with GET & POST
        location ~ ^/pypi/(.*)$ {
        
            rewrite ^/pypi/(.*)$ /$1 break;
            proxy_pass https://pypi.org;
            limit_except GET OPTIONS {
                deny all;
            }
            proxy_ssl_name pypi.org;
            proxy_set_header Host pypi.org;
            proxy_set_header X-Forwarded-Host pypi.org;
            proxy_ssl_server_name on;
        }
      }
    }