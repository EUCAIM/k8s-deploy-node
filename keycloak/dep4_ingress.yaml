apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy-keycloak
  namespace: keycloak
  annotations:
#   kubernetes.io/ingress.class: nginx
#   nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
#   nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # The following line is needed when the proxy returns "502 - bad gateway" 
    # and in the proxy log apears: ERROR upstream sent too big header while reading response header from upstream
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
spec:
  ingressClassName: nginx
  rules:
    - host: eucaim-node.i3m.upv.es
      http:
        paths:
#         - path: /
          - path: /auth/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
