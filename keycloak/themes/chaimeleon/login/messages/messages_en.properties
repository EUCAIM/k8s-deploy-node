user.attributes.requiredRoles=Required roles

role_authorised_technical_data_manager=Authorised technical data manager
role_authorised_technical_data_manager_description=Mark this if you need to ingest (manually or in-bulk) new patient cases (images and clinical data) to the CHAIMELEON repository.
role_clinical_staff=Clinical staff
role_clinical_staff_description=Mark this if you need to browse patient cases and run AI models and tools over a patient case to carry out diagnosis, prognosis, follow-up.
role_dataset_administrator=Dataset administrator
role_dataset_administrator_description=Mark this if you need to create and manage datasets.
role_data_scientist=Data scientist
role_data_scientist_description=Mark this if you need to use datasets, running standalone applications in the platform, to develop and train AI models/tools and your organization is part of the CHAIMELEON consortium.
role_external_researcher=External researcher
role_external_researcher_description=Mark this if you need to use datasets, running standalone applications in the platform, to develop and train AI models/tools but you (or your organization) are not in the CHAIMELEON consortium.
role_application_developer=Application developer
role_application_developer_description=Mark this if you need to use datasets, running standalone applications in the platform, to develop AI tools and publish them in the marketplace.
role_data_protection_officer=Data protection officer
role_data_protection_officer_description=Mark this if you need to access the dataset history or model history to watch over the fulfilment of the data protection regulations.
role_cloud_services_and_security_manager=Cloud services and security manager
role_cloud_services_and_security_manager_description=Mark this if you need to manage users and register processing applications.


