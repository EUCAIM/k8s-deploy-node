apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      priorityClassName: core-services
      nodeSelector: 
        chaimeleon.eu/target: core-services
      volumes:
        - name: vol-themes-data
          persistentVolumeClaim:
            claimName: themes-data
        - name: vol-standalone-deployments
          persistentVolumeClaim:
            claimName: standalone-deployments
      containers:
      - name: keycloak
        image: "quay.io/keycloak/keycloak:26.2.0"
        args: ["start", "--http-relative-path=/auth", "--features=token-exchange", "--http-enabled=true", "--proxy-headers=xforwarded"]
        resources:
          requests:
            memory: "1000Mi"
            cpu: "1500m"
#         limits:
#           memory: "1000Mi"
#           cpu: "1500m"
        volumeMounts:
          - name: vol-themes-data
            mountPath: "/opt/keycloak/themes/eucaim-node/"
            subPath: "eucaim-node"
          - name: vol-standalone-deployments
            mountPath: "/opt/keycloak/providers/event-listener-datasetservice-1.0.0.jar"
            subPath: "event-listener-datasetservice-1.0.0.jar"
            readOnly: false
#         - name: vol-standalone-deployments
#           mountPath: "/opt/keycloak/providers/event-listener-kubeauthorizer-1.1.0.jar"
#           subPath: "event-listener-kubeauthorizer-1.1.0.jar"
#           readOnly: false
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: "admin"
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          value: "XXXXXXXXXX"

        # Doc: https://www.keycloak.org/server/all-config
        - name: KC_PROXY
          value: "edge"
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL_HOST
          value: db
        - name: KC_DB_URL_PORT
          value: "5432"
        - name: KC_DB_USERNAME
          value: "keycloak-user"
        - name: KC_DB_PASSWORD
          value: "XXXXXXXXXX"
        - name: KC_HOSTNAME
          # This is recommended for checking the "host" header of requests
          value: "eucaim-node.i3m.upv.es"

        # Doc: https://www.keycloak.org/server/configuration-provider
        - name: KC_SPI_EVENTS_LISTENER_EVENT_LISTENER_DATASETSERVICE_OIDCGROUPS
          value: "application-developer,cloud-services-and-security-management,data-scientists,external-researcher"
        - name: KC_SPI_EVENTS_LISTENER_EVENT_LISTENER_DATASETSERVICE_ADMIN_EVENT
          value: "GROUP_MEMBERSHIP"
        - name: KC_SPI_EVENTS_LISTENER_EVENT_LISTENER_DATASETSERVICE_KEYCLOAK_CLIENT
          value: "kubeauthorizer-pod"
        - name: KC_SPI_EVENTS_LISTENER_EVENT_LISTENER_DATASETSERVICE_KEYCLOAK_CLIENT_SECRET
          value: "XXXXXXXXXX"
        - name: KC_SPI_EVENTS_LISTENER_EVENT_LISTENER_DATASETSERVICE_KEYCLOAK_ENDPOINT
          value: "https://eucaim-node.i3m.upv.es"
        - name: KC_SPI_EVENTS_LISTENER_EVENT_LISTENER_DATASETSERVICE_DATASET_SERVICE_ENDPOINT
          value: "https://eucaim-node.i3m.upv.es/dataset-service/api"
#       - name: KC_SPI_EVENTS_LISTENER_EVENT_LISTENER_KUBEAUTHORIZER_OIDCGROUPS
#         value: "admins,application-developer,cloud-services-and-security-management,data-scientists,external-researcher"
#       - name: KC_SPI_EVENTS_LISTENER_EVENT_LISTENER_KUBEAUTHORIZER_ADMIN_EVENT
#         value: "GROUP_MEMBERSHIP"
#       - name: KC_SPI_EVENTS_LISTENER_EVENT_LISTENER_KUBEAUTHORIZER_KUBE_AUTHORIZER_ENDPOINT
#         value: "XXXXXXXXXX"
#       - name: KC_SPI_EVENTS_LISTENER_EVENT_LISTENER_KUBEAUTHORIZER_KUBE_AUTHORIZER_USER_CLAIM
#         value: "username"
#       - name: KC_SPI_EVENTS_LISTENER_EVENT_LISTENER_KUBEAUTHORIZER_KUBE_AUTHORIZER_TOKEN
#         value: "XXXXXXXXXX"

        ports:
          - name: http
            containerPort: 8080
          - name: https
            containerPort: 8443
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /auth/realms/master
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  selector:
    app: keycloak
  type: LoadBalancer
  ports:
  - name: http
    port: 8080
    targetPort: 8080
