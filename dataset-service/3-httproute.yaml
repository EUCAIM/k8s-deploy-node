apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dataset-service-backend-route
  namespace: dataset-service
  annotations:
    description: "HTTPRoute for Dataset Service backend API"
spec:
  parentRefs:
    - name: main-gateway
      namespace: default
      sectionName: https
  hostnames:
    - "mininode.imaging.i3m.upv.es"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dataset-service
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: dataset-service-buffering
      backendRefs:
        - name: dataset-service-backend-service
          port: 11000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dataset-service-buffering
  namespace: dataset-service
spec:
  buffering:
    maxRequestBodyBytes: 125829120  # 120MB
    memRequestBodyBytes: 2097152    # 2MB in memory
    retryExpression: "IsNetworkError() && Attempts() < 2"
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: dataset-service-transport
  namespace: dataset-service
spec:
  serverName: ""
  insecureSkipVerify: false
  rootCAs: []
  maxIdleConnsPerHost: 10
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 300s
    idleConnTimeout: 90s
