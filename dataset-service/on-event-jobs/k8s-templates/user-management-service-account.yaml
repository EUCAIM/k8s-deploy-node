apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-management-sa

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: user-management-sa
rules:
  - apiGroups: ["*"]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["*"]
    resources: ["configmaps", "secrets", "ciliumnetworkpolicies", "networkpolicies", "clusterrolebindings", "rolebindings"]
    verbs: ["get", "list","watch", "create", "delete", "patch"]
  # Below the same rules which are in extra-configurations/roles-and-bindings/oid-datascientists-in-user-namespace-role.yaml
  # It is because the service account must have all the permissions that it tries to give.
  - apiGroups: ["*"]
    resources: ["deployments", "replicasets", "pods", "pods/log", "pods/exec", "jobs", "jobs/status", "container", 
      "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["*"]
    resources: ["events", "ingresses", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: user-management-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: user-management-sa
subjects:
  - kind: ServiceAccount
    name: user-management-sa
    namespace: dataset-service
