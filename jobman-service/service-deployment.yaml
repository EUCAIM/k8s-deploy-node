apiVersion: v1
kind: Service
metadata:
  name: jobman-service
  namespace: jobman-service
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: api
  selector:
    app: jobman-service-deployment
  
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobman-service-deployment
  namespace: jobman-service
spec:
  selector:
    matchLabels:
      app: jobman-service-deployment
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jobman-service-deployment
    spec:
      priorityClassName: core-services
      nodeSelector:
        chaimeleon.eu/target: core-services
      serviceAccountName: jobman-serviceaccount
      containers:
      - image: jobman-service:2.2.7
        imagePullPolicy: Always
        name: jobman-service-deployment-container
        env:
        - name: SETTINGS_FILE
          value: /opt/jobman/settings.json
        resources:
          requests:
            memory: "4Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "1"
        ports:
        - containerPort: 8080
          name: api
        volumeMounts:
          - name: logs
            mountPath: /var/log/jobman
          - name: webservice-configmap
            mountPath: /opt/jobman/settings.json
            subPath: settings.json
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: jobman-service-logs
        - name: webservice-configmap
          configMap:
            defaultMode: 420
            name: webservice-config

