apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    kubernetes.io/enforce-mountable-secrets: "true"
  namespace: jobman-service
  name: jobman-queue-position

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jobman-queue-position-role-configmap
  namespace: jobman-service
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jobman-queue-position-rolebinding-configmap
  namespace: jobman-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jobman-queue-position-role-configmap
subjects:
  - namespace: jobman-service
    kind: ServiceAccount
    name: jobman-queue-position

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jobman-queue-position-role-jobs
  namespace: jobman-service
rules:
  - apiGroups:
      - ""
      - apps
      - batch
    resources:
      - pods
      - jobs
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jobman-queue-position-rolebinding-jobs
  namespace: jobman-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jobman-queue-position-role-jobs
subjects:
  - namespace: jobman-service
    kind: ServiceAccount
    name: jobman-queue-position