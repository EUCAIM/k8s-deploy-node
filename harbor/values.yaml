expose:
  type: ingress
  tls: 
    enabled: true
    certSource: secret
    secret:
      secretName: harbor.eucaim-node.i3m.upv.es
  ingress:
    annotations: 
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
      # This is to disable the uploads in 2 steps. 
      # When it is 'on' (default), there is a first step when the layer of image is uploaded entirely to a buffer in the proxy 
      # and then in a 2nd step the content of buffer is transfered to the destination pod.
      nginx.ingress.kubernetes.io/proxy-request-buffering: 'off'
    hosts:
      core: harbor.eucaim-node.i3m.upv.es

# The external URL for Harbor core service. It is used to
# 1) populate the docker/helm commands showed on portal
# 2) populate the token service URL returned to docker client
externalURL: https://harbor.eucaim-node.i3m.upv.es

persistence:
    enabled: true
    persistentVolumeClaim:
      registry:
        existingClaim: harbor-harbor-pvc
        subPath: registry
      jobservice:
        jobLog:
          existingClaim: harbor-harbor-pvc
          subPath: jobservice
      database:
        existingClaim: harbor-harbor-pvc
        subPath: database
      redis:
        existingClaim: harbor-harbor-pvc
        subPath: redis
      trivy:
        existingClaim: harbor-harbor-pvc
        subPath: trivy

harborAdminPassword: XXXXXXXXXXXXXXXXX

# The internal TLS used for harbor components secure communicating. In order to enable https
# in each component tls cert files need to provided in advance.
internalTLS:
  enabled: true
  certSource: auto

metrics:
  enabled: false
  
# If service exposed via "ingress", the Nginx will not be used
#nginx:
