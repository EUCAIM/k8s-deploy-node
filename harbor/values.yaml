portal:
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1024Mi"
      cpu: "1000m" #1 cpu
  nodeSelector:
    chaimeleon.eu/target: core-services
  priorityClassName: core-services

core:
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1024Mi"
      cpu: "1000m" #1 cpu
  nodeSelector:
    chaimeleon.eu/target: core-services
  priorityClassName: core-services

jobservice:
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1024Mi"
      cpu: "1000m" #1 cpu
  nodeSelector:
    chaimeleon.eu/target: core-services
  priorityClassName: core-services

registry:
  registry:
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1024Mi"
        cpu: "1000m" #1 cpu
  controller:
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1024Mi"
        cpu: "1000m" #1 cpu
  nodeSelector:
    chaimeleon.eu/target: core-services
  priorityClassName: core-services
  credentials:
    username: admin
    password: XXXXXXXXXXX
    # The documentation says that htpasswd excludes username and password, but it is not true, 
    # they are used anyway to configure the "core" service, so if you don't set them, the default values will be used 
    # and will not match with the htpasswd used to configure the "registry" service and so the CLI login (docker login) will fail.
    # Conclusion: you should ADDITIONALLY set the htpasswd only if you have to integrate with tools like argocd or flux,
    #             just mantain the same and not regenerate the salt every time the chart template is rendered.
    #             It can be generated (for admin and some-password) with: apt install apache2-utils && htpasswd -nbBC10 admin some-password
    #htpasswdString: admin:XXXXXXXXXXXXXX

trivy:
  enabled: true
  resources:
    requests:
