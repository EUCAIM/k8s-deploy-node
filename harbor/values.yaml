expose:
  type: ingress
  tls: 
    enabled: true
    certSource: secret
    secret:
      secretName: harbor.chaimeleon-eu.i3m.upv.es
  ingress:
    harbor:
      annotations: 
        cert-manager.io/cluster-issuer: letsencrypt-prod
        kubernetes.io/ingress.class: nginx
    hosts:
      core: harbor.chaimeleon-eu.i3m.upv.es
