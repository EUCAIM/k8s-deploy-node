#externalURL: https://chaimeleon-eu.i3m.upv.es:10443
externalURL: https://harbor.chaimeleon-eu.i3m.upv.es

internalTLS:
  enabled	: true
  certSource: auto

persistence:
    enabled	: true
    persistentVolumeClaim:
      registry:
        existingClaim: harbor-harbor-pvc
        subPath: registry
      chartmuseum:
        existingClaim: harbor-harbor-pvc	
        subPath: chartmuseum
      jobservice:
        existingClaim: harbor-harbor-pvc
        subPath: jobservice
      database:
        existingClaim: harbor-harbor-pvc
        subPath: database
      redis:
        existingClaim: harbor-harbor-pvc
        subPath: redis
      trivy:
        existingClaim: harbor-harbor-pvc
        subPath: trivy


harborAdminPassword: XXXXXXXXXXXXXXXXX

portal:
  priorityClassName: core-services
  resources:
    requests:
      memory: "1000Mi"
      cpu: "1000m"
    limits:
      memory: "1000Mi"
      cpu: "1000m" #1 Gb

core:
  priorityClassName: core-services
  resources:
    requests:
      memory: "1000Mi"
      cpu: "1000m"
    limits:
      memory: "1000Mi"
      cpu: "1000m" #1 Gb

jobservice:
  priorityClassName: core-services
  resources:
    requests:
      memory: "500Mi"
      cpu: "500m"
    limits:
      memory: "500Mi"
      cpu: "500m" #1 Gb

registry:
  priorityClassName: core-services
  credentials:
    username: admin
    password: XXXXXXXXXXXXXXXXX
    htpasswd: admin:XXXXXXXXXXXXXXXXX
  registry:
    resources:
      requests:
        memory: "1000Mi"
        cpu: "1000m"
      limits:
        memory: "1000Mi"
        cpu: "1000m" #1 Gb    
  controller:
    resources:
      requests:
        memory: "1000Mi"
        cpu: "1000m"
      limits:
        memory: "1000Mi"
        cpu: "1000m" #1 Gb    

chartmuseum:
  enabled	: true
  priorityClassName: core-services
  resources:
    requests:
      memory: "500Mi"
      cpu: "500m"
    limits:
      memory: "500Mi"
      cpu: "500m" 

trivy:
  enabled	: true
  priorityClassName: core-services
  resources:
    requests:
      memory: "500Mi"
      cpu: "500m"
    limits:
      memory: "500Mi"
      cpu: "500m" #1 Gb

notary:
  enabled: false

database:
  type: internal
  internal:
    password: XXXXXXXXXXXXXXXXX
    priorityClassName: core-services
    resources:
      requests:
        memory: "1000Mi"
        cpu: "1000m"
      limits:
        memory: "1000Mi"
        cpu: "1000m" #1 Gb

redis:
  type: internal
  internal:
    resources:
      requests:
        memory: "500Mi"
        cpu: "500m"
      limits:
        memory: "500Mi"
        cpu: "500m" #1 Gb
    priorityClassName: core-services

exporter:
  priorityClassName: core-services
  resources:
    requests:
      memory: "250Mi"
      cpu: "500m"
    limits:
      memory: "250Mi"
      cpu: "500m" #1 Gb

