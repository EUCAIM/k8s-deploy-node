apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-gateway-config
data:
  nginx-config: |
    user root;
    worker_processes 4;

    events {
        worker_connections 4096;
    }

    http {
        upstream harbor {
            server harbor-core:443;
        }

        server {
            #listen 80;
            listen 443 ssl;
            ssl_certificate /etc/nginx/certs/tls.crt;
            ssl_certificate_key /etc/nginx/certs/tls.key;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            client_max_body_size 500M;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;

            proxy_http_version 1.1;

            location / {
                # You can generate the basic auth token with: 
                #   echo -n "robot\$common-user:<theCLITokenOfTheRobot>" | base64
                proxy_set_header   Authorization "Basic XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX";
                proxy_pass         https://harbor;
            }
            
            location /healthz {
                return 200;
            }
        }
    }
