apiVersion: v1
data:
  token_rule.py: >
    import requests


    import sys



    import warnings



    import json



    import importlib, subprocess, site


    # Make sure you install packages that might not be in FEM by default

    def ensure_package(package_name, import_name=None):
        import_name = import_name or package_name
        try:
            return importlib.import_module(import_name)
        except ImportError:
            subprocess.check_call([sys.executable, "-m", "pip", "install", "--user", package_name, "--quiet"],
            stdout=sys.stderr,  # redirect pip stdout to stderr
            stderr=sys.stderr)
            # Add user site-packages to sys.path if not already there
            user_site = site.getusersitepackages()
            if user_site not in sys.path:
                sys.path.insert(0, user_site)
            
            # Reload importlib to see new package
            importlib.invalidate_caches()
            
            return importlib.import_module(import_name)


    import config




    jwt = ensure_package("PyJWT", "jwt")




    # --- No warnings leak to stdout ---



    warnings.filterwarnings("ignore",
    category=requests.packages.urllib3.exceptions.InsecureRequestWarning)




    # --- Prints go to stderr unless explicitly stated otherwise ---



    def log(msg):
        print(msg, file=sys.stderr, flush=True)

    # Check that a token was provided



    if len(sys.argv) < 2:
        print("Usage: python3 script.py <token>")
        sys.exit(1)

    # Fetch token from command arguments



    token = sys.argv[1]




    # --- Try to decode token to inspect the issuer ---



    try:
        decoded = jwt.decode(token, options={"verify_signature": False})
        issuer = decoded.get("iss", "")
        log(f"Detected token issuer: {issuer}")
    except Exception as e:
        log(f"Failed to decode token: {e}")
        issuer = ""

    # --- Decide whether to do the first exchange ---



    if issuer.startswith("https://login.aai.lifescience-ri.eu/oidc/"):
        log("Token is already a LifeScience token; skipping first exchange.")
        ls_token = token
    else:
        log("Performing first token exchange to obtain LifeScience token...")
        url = f"{config.api_base_url}/token/ls_token"
        headers = {
            "accept": "application/json",
            "Authorization": f"Bearer {token}"
        }

        try:
            response = requests.post(url, headers=headers, verify=False, timeout=20)
            if response.status_code != 200:
                log(f"First exchange failed with status {response.status_code}: {response.text}")
                sys.exit(1)

            data = response.json()
            ls_token = data.get("ls_token")

            if not ls_token:
                log(f"No ls_token found in response: {json.dumps(data, indent=2)}")
                sys.exit(1)

        except requests.exceptions.RequestException as e:
            log(f"Request failed: {e}")
            sys.exit(1)
        except json.JSONDecodeError:
            log(f"Response was not valid JSON: {response.text}")
            sys.exit(1)

    # --- Second token exchange (UPV) ---



    url_2 =
    "https://eucaim-node.i3m.upv.es/auth/realms/EUCAIM-NODE/protocol/openid-connect/token"




    data_2 = {
        "client_id": "fem-client",
        "client_secret": "xxxxx",
        "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
        "subject_token": ls_token,
        "subject_issuer": "lifescience-ri-oidc",
        "subject_token_type": "urn:ietf:params:oauth:token-type:access_token",
        "audience": "jobman-service",
        "scope": "openid"
    }




    try:
        response_2 = requests.post(
            url_2,
            data=data_2,
            headers={"Content-Type": "application/x-www-form-urlencoded"},
            timeout=20
        )

        if response_2.status_code != 200:
            log(f"Second exchange failed with status {response_2.status_code}: {response_2.text}")
            sys.exit(1)

        upv_token = response_2.json().get("access_token")
        if not upv_token:
            log(f"No access_token found in response: {response_2.text}")
            sys.exit(1)

        # Print *only* the token to stdout — everything else goes to stderr.
        sys.stdout.write(upv_token.strip())
        sys.stdout.flush()
        sys.exit(0)

    except requests.exceptions.RequestException as e:
        log(f"Second request failed: {e}")
        sys.exit(1)
    except json.JSONDecodeError:
        log(f"Second response not valid JSON: {response_2.text}")
        sys.exit(1)
