apiVersion: v1
data:
  sandbox_rule.py: >-
    import requests

    import sys

    import os

    import warnings

    import importlib, subprocess, site


    # Make sure you install packages that might not be in FEM by default

    def ensure_package(package_name, import_name=None):
        import_name = import_name or package_name
        try:
            return importlib.import_module(import_name)
        except ImportError:
            subprocess.check_call([sys.executable, "-m", "pip", "install", "--user", package_name, "--quiet"],
            stdout=sys.stderr,  # redirect pip stdout to stderr
            stderr=sys.stderr)
            # Add user site-packages to sys.path if not already there
            user_site = site.getusersitepackages()
            if user_site not in sys.path:
                sys.path.insert(0, user_site)
            
            # Reload importlib to see new package
            importlib.invalidate_caches()
            
            return importlib.import_module(import_name)

    jwt = ensure_package("PyJWT", "jwt")


    warnings.filterwarnings("ignore",
    category=requests.packages.urllib3.exceptions.InsecureRequestWarning)


    def log(msg):
        print(msg, file=sys.stderr)

    if len(sys.argv) < 2:
        print("Usage: python3 script.py <token>")
        sys.exit(1)

    token = sys.argv[1]

    decoded = jwt.decode(token, options={"verify_signature": False})


    preferred_username = decoded.get("preferred_username")

    if not preferred_username:
        sys.stderr.write("Error: preferred_username not found in token.")
        sys.exit(1)

    # Base sandbox path 

    base_sandbox = f"/sandbox/{preferred_username}"

    # Check if user sandbox exists 

    if not os.path.isdir(base_sandbox):
        sys.stderr.write(f"Error: User sandbox does not exist: {base_sandbox}")
        sys.exit(1)

    # Check if FEM subdirectory exists, create if it doesn't 

    fem_sandbox = os.path.join(base_sandbox, "FEM") 

    if not os.path.isdir(fem_sandbox):
        try:
            os.makedirs(fem_sandbox)
        except Exception as e:
            sys.stderr.write(f"Error: Could not create FEM directory: {e}")
            sys.exit(1)


    # Print *only* the sandbox to stdout — everything else goes to stderr.

    sys.stdout.write(fem_sandbox) 

    sys.exit(0)
