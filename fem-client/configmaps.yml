apiVersion: v1
data:
  launcher.json: |
    {
      "submit_run": {
        "method": "POST",
        "url"    : "https://eucaim-node.i3m.upv.es/jobman-service/api/v1/jobs",
        "cmd"    : [
            "curl -X '{method}' -H '{header}'  -d '{body}' '{url}' | jq '.jobName | {\"container_id\": .}'"
        ],
        "header" : [
          "Content-Type: application/json",
          "Authorization: Bearer %%token%%"
        ],
        "body" : {
          "jobName"      : "%%execution_id%%",
          "image"        : "%%DOCKER_IMAGE_NAME%%:%%DOCKER_IMAGE_TAG%%",
          "commandArgs"  : "%%TASK_COMMAND%%",
          "dryRun"       : false,
          "resources"    : "medium-gpu",
          "datasetsList" : "%%DATASET_ID%%"
        }
      },
      "cancel_run": {
        "method" : "DELETE",
        "url"    : "https://eucaim-node.i3m.upv.es/jobman-service/api/v1/jobs/%%execution_id%%",
        "cmd"    : [
           "curl -X '{method}' '{url}' -H '{header}' &&",
           "echo \"{\\\"status\\\": \\\"cancelled\\\", \\\"container_id\\\": \\\"%%CONTAINER_ID%%\\\"}\" | jq '.'"
        ],
        "header" : [
          "Content-Type: application/json",
          "Authorization: Bearer %%token%%"
        ]
      },
      "run_status": {
        "method": "GET",
        "url"    : "https://eucaim-node.i3m.upv.es/jobman-service/api/v1/jobs/%%execution_id%%/logs",
        "cmd": [
          "curl -X '{method}' -H '{header}'  '{url}' 2>/dev/null | tee >(jq -r '.stdOut' >  %%sandbox_fem%%/%%user_id%%/%%execution_id%%/%%task_id%%.log) | jq '.stdOut | {\"container_id\": \"%%CONTAINER_ID%%\", \"logs\": .}'"
        ],
        "header" : [
          "Content-Type: application/json",
          "Authorization: Bearer %%token%%"
        ]
      },
      "run_report": {
        "method": "GET",
        "url"    : "https://eucaim-node.i3m.upv.es/jobman-service/api/v1/jobs/%%execution_id%%",
        "cmd": [
          "curl -X '{method}' -H '{header}'  '{url}' | jq '. | .exit_code = .exitCode | .start_time = .startedAt | .stop_time = .finishedAt | .elapsed_time_sec = .executionDuration | .error = (if (.errors | length) > 0 then .errors else null end) | .mounts = (.mounts // [] | map(\":\\(.mountPath):\\(.readOnly // \"\")\")) | del(.exitCode, .startedAt, .finishedAt, .executionDuration, .errors)'"
        ],
        "header" : [
          "Content-Type: application/json",
          "Authorization: Bearer %%token%%"
        ]
      },
      "print_images": {
        "method": "GET",
        "url"    : "https://eucaim-node.i3m.upv.es/jobman-service/api/v1/images/",
        "cmd": [
          "curl -X '{method}' -H '{header}' '{url}' | jq '[.data[] | .name as $repo | .artifacts[] | {repository: $repo, tag: .tags[], image_id: null, sha256_digest: .digest}]'"
        ],
        "header" : [
          "Content-Type: application/json",
          "Authorization: Bearer %%token%%"
        ]
      },
      "token_rule": {
        "cmd" : "python3 config/token_rule.py %%token%%"
      },
      "sandbox_rule": {
        "cmd" : "python3 config/sandbox_rule.py %%token%%"
      },
        "site_vars": {
        "DATASET_ID": "c2677037-3e1a-4cc2-90f0-e76cb677de17",
        "API_TOKEN" : ""
      }
    }
