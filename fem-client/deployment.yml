apiVersion: apps/v1
kind: Deployment
metadata:
  name: fem-client
  namespace: eucaim-fed-computation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fem-client
  template:
    metadata:
      labels:
        app: fem-client
    spec:
      containers:
        - command:
            - bash
            - /app/entrypoint-k8s.sh
          image: registry.gitlab.bsc.es/fl/fem-client:v3.0.0
          imagePullPolicy: Always
          name: fem-client
          env:
            - name: UID
              value: '1000'
            - name: GID
              value: '1000'
            - name: USER_NAME
              value: fem
          resources:
            limits:
              cpu: '2'
              memory: 8Gi
            requests:
              cpu: '2'
              memory: 8Gi
          volumeMounts:
            - name: config-entrypoint
              mountPath: /app/entrypoint-k8s.sh
              subPath: entrypoint-k8s.sh
            - mountPath: /app/.env
              name: config-env
              subPath: .env
            - mountPath: /app/logs
              name: fem-client-vol
              subPath: logs/
            - mountPath: /data
              name: fem-client-vol
              subPath: data/
            - mountPath: /sandbox
              name: homes
            - mountPath: /app/config
              name: config
          workingDir: /app
      initContainers:
        - command:
            - sh
            - '-c'
            - chown -R 1000:1000 /data && chown 1000:1000 /app/logs
          image: busybox:1.33
          name: init-fem
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: /app/logs
              name: fem-client-vol
              subPath: logs/
            - mountPath: /data
              name: fem-client-vol
              subPath: data/
      nodeSelector:
        chaimeleon.eu/target: core-services
      priorityClassName: core-applications
      volumes:
        - cephfs:
            monitors:
              - 192.168.10.230:6789
              - 192.168.10.3:6789
              - 192.168.10.4:6789
            path: /homes/users/
            secretRef:
              name: ceph-auth
            user: fem-client
          name: homes
        - name: fem-client-vol
          persistentVolumeClaim:
            claimName: fem-client-pvc
        - configMap:
            defaultMode: 420
            items:
              - key: .env
                path: .env
            name: fem-client-env
          name: config-env
        - name: config-entrypoint
          configMap:
            name: fem-client-entrypoint
            items:
              - key: entrypoint-k8s.sh
                path: entrypoint-k8s.sh
            defaultMode: 422
        - name: config
          projected:
            defaultMode: 420
            sources:
              - secret:
                  items:
                    - key: EUCAIM_client_cert.pem
                      path: rabbitmq-certificates/EUCAIM_client_cert.pem
                    - key: EUCAIM_client_csr.pem
                      path: rabbitmq-certificates/EUCAIM_client_csr.pem
                    - key: EUCAIM_client_key.pem
                      path: rabbitmq-certificates/EUCAIM_client_key.pem
                    - key: rootCA_cert.pem
                      path: rabbitmq-certificates/rootCA_cert.pem
                  name: fem-client-secrets
              - configMap:
                  items:
                    - key: launcher.json
                      path: launcher.json
                  name: fem-client-launcher
              - configMap:
                  items:
                    - key: config.py
                      path: config.py
                  name: fem-client-config
              - configMap:
                  items:
                    - key: token_rule.py
                      path: token_rule.py
                  name: fem-client-token-rule
              - configMap:
                  items:
                    - key: sandbox_rule.py
                      path: sandbox_rule.py
                  name: fem-client-sandbox-rule