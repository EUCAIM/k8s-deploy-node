
apiVersion: v1
kind: Secret
metadata:
  name: "postgres-password"
  namespace: kube-authorizer
type: Opaque
stringData:
  password: "XXXXXXXX"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-authorizer
  namespace: kube-authorizer
data:
  kube-authorizer.yaml: |
    {
        "kubernetes": {
          "auth_token":  "XXXXXXXX",
          "endpoint": "https://192.168.1.14:6443",
        },
        "tenants": {
          "namespace_name": "username"
        },
        "self": {
          "name": "kube-authorizer",
          "host": "0.0.0.0",
          "port": 80,
          "token_rest_api_secret": "XXXXXXXX",
          "log": {
            "config_file": "/etc/kube-authorizer/logging.cfg",
            "level": "DEBUG",
            "file": "/var/log/kube-authorizer/kube-authorizer.log",
            "file_max_size": 10485760
          },
          "db": {
            "host": "db",
            "port": 5432,
            "user": "kubeauth-user",
            "password": "XXXXXXXX",
            "db": "kubeauth"
          },
          "ssl": {
            "enabled": false,
            "certfile": "",
            "keyfile": ""
          }      
        }
    }
  kube-authorizer-cli.yaml: |
    {
      "endpoint": "http://localhost:80",
      "token_rest_api_secret": "XXXXXXXX"   
    } 
  logging.cfg: |
    [loggers]
    keys=root,kube-authorizer,controller

    [handlers]
    keys=fileHandler

    [formatters]
    keys=simpleFormatter

    [logger_root]
    level=DEBUG
    qualname=root
    handlers=fileHandler

    [logger_kube-authorizer]
    level=INFO
    handlers=fileHandler
    qualname=kube-authorizer
    propagate=0

    [logger_controller]
    level=DEBUG
    handlers=fileHandler
    qualname=controller
    propagate=0

    [handler_fileHandler]
    class=logging.handlers.RotatingFileHandler
    level=DEBUG
    formatter=simpleFormatter
    args=('/var/log/kube-authorizer/kube-authorizer.log', 'w', 10485760, 3)

    [formatter_simpleFormatter]
    format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
    datefmt=%m/%d/%Y %I:%M:%S
