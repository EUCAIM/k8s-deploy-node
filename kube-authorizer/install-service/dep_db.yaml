
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: kube-authorizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      priorityClassName: core-services
      volumes:
        - name: postgres-data-pv
          persistentVolumeClaim:
            claimName: postgres-data
      containers:
      - name: db
        image: "harbor.chaimeleon-eu.i3m.upv.es/dockerhub/library/postgres:12"
        env:
          - name: POSTGRES_DB
            value: kubeauth
          - name: POSTGRES_USER
            value: kubeauth-user
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-password
                key: password
        ports:
          - containerPort: 5432
            # standard postgres DB port
            name: "dbport"
        volumeMounts:
          - mountPath: "/var/lib/postgresql/data"
            name: postgres-data-pv
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: kube-authorizer
spec:
  selector:
    app: db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
