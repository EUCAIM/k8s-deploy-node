apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-template-config
data:
  nginx-config: |
    user root;
    worker_processes 4;

    events {
        worker_connections 4096;
    }

    http {

        upstream front {
            server front:{{ .Values.front.port }};
        }

        upstream back {
            server back:{{ .Values.back.port }};
        }

        upstream viewer {
            server viewer:{{ .Values.viewer.port }};
        }

        upstream qplink {
            server qplink:{{ .Values.qplink.port }};
        }

        server {
            listen 80;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 500M;

            location / {
                proxy_pass http://front;
            }

            location /care {
                proxy_pass http://back;
            }

            location /viewer {
                proxy_pass http://viewer/;
            }

            location /miuccloud/ {
                proxy_pass http://qplink/;
            }

            location /qpinsights-front-angular-public-shared-config.json {
                alias /usr/share/nginx/html/qpinsights-front-angular-public-shared-config.json;
            }
            
            location /viewer-front-angular-public-shared-config.json {
                alias /usr/share/nginx/html/viewer-front-angular-public-shared-config.json;
            }
        }
    }
