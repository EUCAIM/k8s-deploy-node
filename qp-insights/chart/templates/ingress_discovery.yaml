apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: discovery
  annotations:
{{- if .Values.ingress.includeCertManagerAnnotation }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
{{- end }}
    nginx.ingress.kubernetes.io/use-regex:  "true"
#   nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
#   nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Increase the max body size for POST operations, 
    # this is needed when the service returns "413 Request Entity Too Large"
    nginx.ingress.kubernetes.io/proxy-body-size: 500m
    nginx.ingress.kubernetes.io/proxy-buffer-size: '16k'
    # That timeout is 300 seconds in the application proxy ("gateway" deployment), 
    # so it must be adjusted also here (the proxy in front), otherwise the connection is closed here before the gateway response.
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    # This is to disable the uploads in 2 steps. 
    # When it is 'on' (default), there is a first step when the file is uploaded entirely to a buffer in the proxy 
    # and then in a 2nd step the content of buffer is transfered to the destination pod.
    nginx.ingress.kubernetes.io/proxy-request-buffering: 'off'
spec:
  ingressClassName: nginx
{{- if .Values.ingress.includeCertManagerAnnotation }}
  tls:
  - hosts:
    - {{ .Values.ingress.discoveryHost }}
    secretName: {{ .Values.ingress.discoveryHost }}
{{- end }}
  rules:
    - host: {{ .Values.ingress.discoveryHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80

